name: Windbar
options:
  bundleIdPrefix: com.lucidfabrics
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: KRPUAN3FFA
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
targets:
  Windbar:
    type: application
    platform: macOS
    sources:
      - path: Windbar
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucidfabrics.windbar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Scoped to this target on purpose. Setting PROVISIONING_PROFILE_SPECIFIER
        # globally on the xcodebuild command line also hits the SwiftPM targets,
        # and KeyboardShortcuts fails with "does not support provisioning profiles".
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Windbar MAS
    info:
      path: Windbar/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        NSBluetoothAlwaysUsageDescription: "Windbar uses Bluetooth to pair new Dreo fans onto your WiFi network."
        CFBundleURLTypes:
          - CFBundleURLName: com.lucidfabrics.windbar
            CFBundleURLSchemes:
              - windbar
    entitlements:
      path: Windbar/Resources/Windbar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.bluetooth: true
  WindbarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WindbarTests
    dependencies:
      - target: Windbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucidfabrics.windbar.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Windbar:
    build:
      targets:
        Windbar: all
        WindbarTests: [test]
    test:
      targets:
        - WindbarTests
    run:
      config: Debug
